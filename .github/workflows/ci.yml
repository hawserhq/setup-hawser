name: ci

# GitHub-hosted Windows runners cannot run WSL2, so CI exercises everything up
# to the engine install: resolve, download, verify against SHA256SUMS, extract,
# PATH, and `hawser version`. The full install path is exercised on self-hosted
# runners by the projects that use the action; its script is the same file.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage-via-action:
    name: action stages hawser.exe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: hawser
        uses: ./
        with:
          install: 'false'
      - name: hawser.exe is on PATH and reports its version
        shell: pwsh
        run: |
          $out = & hawser version 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          # 3 = no engine installed, which is exactly this runner's state.
          if ($code -ne 0 -and $code -ne 3) { throw "hawser version exited $code" }
          if (-not "${{ steps.hawser.outputs.version }}") { throw "action reported no version output" }
          if ($env:HAWSER_HOME -ne "${{ steps.hawser.outputs.home }}") { throw "HAWSER_HOME and the home output disagree" }
          Write-Host "staged hawser ${{ steps.hawser.outputs.version }} at ${{ steps.hawser.outputs.home }}"

  stage-via-script:
    name: script stages hawser.exe (GitLab-style)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the script the way a GitLab before_script would
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -File scripts/install-hawser.ps1 -Install:$false -Dest "$env:RUNNER_TEMP\hawser-script"
          if (-not (Test-Path "$env:RUNNER_TEMP\hawser-script\bin\hawser.exe")) { throw "hawser.exe not staged" }

  wsl2-gate:
    name: the WSL2 gate fails clearly on a hosted runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "install=true must fail with the WSL2 message, not something opaque"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = pwsh -File scripts/install-hawser.ps1 -Install:$true -Dest "$env:RUNNER_TEMP\hawser-gate" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw "expected the install to be refused on a hosted runner" }
          if ($out -notmatch 'WSL2 is not available') { throw "refused, but without the WSL2 explanation" }

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { throw "$($findings.Count) PSScriptAnalyzer error(s)" }
